<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF--8" />
  <link rel="icon" type="image/png" href="https://kjunynajewbtxqojxbok.supabase.co/storage/v1/object/public/ESGR/logo_esgr.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Análise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <style>
    #preloader {
      transition: opacity 0.7s ease-in-out;
    }
    .loader {
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-left-color: #22d3ee; /* Cor ciano */
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: {
              '400': '#22d3ee',
            },
            purple: {
              '500': '#a855f7',
            },
            lime: {
              '400': '#a3e635',
              '500': '#84cc16',
            },
            green: {
              '500': '#22c55e',
            }
          },
          fontFamily: {
            sans: ['"Open Sans"', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
<body class="bg-black">
  <div id="preloader" class="fixed inset-0 bg-black z-[100] flex items-center justify-center">
    <div class="loader"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
